name: Build Windows installer

# Build a standalone .exe and a Setup.exe installer on every push.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Install project requirements if present (app currently uses only the stdlib).
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build executable with PyInstaller
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "HJC Barcode Scanner"
          main.py

      - name: Derive version string
        id: version
        shell: bash
        run: echo "value=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build installer with Inno Setup
        run: >
          iscc
          /DAppVersion=${{ steps.version.outputs.value }}
          installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HJC-Barcode-Scanner-Setup
          path: installer_output/*.exe
          if-no-files-found: error

      - name: Upload standalone executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HJC-Barcode-Scanner-exe
          path: "dist/HJC Barcode Scanner.exe"
          if-no-files-found: error
