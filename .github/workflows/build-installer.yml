name: Windows telepítő készítése

# Minden push-nál megépíti az .exe-t + a telepítőt (ellenőrzi a buildet),
# és GitHub Release-t tesz közzé, ha egy verziócímke (pl. v0.0.1) érkezik.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # a Release-ek létrehozásához szükséges

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Projektfüggőségek telepítése, ha vannak (jelenleg csak a beépített modulokat használja).
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Futtatható fájl építése PyInstallerrel
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "ClearAdmin-CSV-vonalkod-olvaso"
          --icon "assets/icon.ico"
          --add-data "assets;assets"
          main.py

      - name: Verziószám meghatározása
        id: version
        shell: bash
        run: |
          # Címke push-nál a címkét használjuk (a kezdő „v” levágva); egyébként dev build szám.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Telepítő építése Inno Setuppal
        run: >
          iscc
          /DAppVersion=${{ steps.version.outputs.value }}
          installer.iss

      - name: Telepítő artifact feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: ClearAdmin-CSV-vonalkod-olvaso-Setup
          path: installer_output/*.exe
          if-no-files-found: error

      - name: Önálló futtatható fájl artifact feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: ClearAdmin-CSV-vonalkod-olvaso-exe
          path: "dist/ClearAdmin-CSV-vonalkod-olvaso.exe"
          if-no-files-found: error

      # ── Release közzététele csak akkor, ha verziócímke érkezik ──────
      - name: GitHub Release közzététele
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ClearAdmin CSV vonalkód olvasó ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            installer_output/*.exe
            dist/ClearAdmin-CSV-vonalkod-olvaso.exe
